<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Pocket Gacha Battle Strip</title>
  <link rel="stylesheet" href="strip.css">
</head>
<body>
  <main id="strip" class="area-grassland">
    <section id="world" aria-label="Automatic battle">
      <canvas id="stage"></canvas>
      <div id="turn-order"><small>NEXT</small><span>—</span></div>
      <div id="announce"></div>
    </section>
    <div id="controls" data-interactive>
      <button id="hud" type="button" title="Open collection and team management">
        <span id="location">GRASSLAND</span>
        <strong id="stage-label">STAGE 1</strong>
        <span id="wave-label">1/3</span>
        <span id="modifier-label">OPEN FIELD</span>
        <span class="gem">◆ <b id="gems">0</b></span>
        <span class="coin">● <b id="gold">0</b></span>
        <span class="open">MENU</span>
      </button>
      <button id="hide-strip" type="button" title="Hide strip · restore with ⌘⇧G">×</button>
    </div>
  </main>
  <script type="module" src="src/strip.js"></script>
</body>
</html>
