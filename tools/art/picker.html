<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Pixiv art picker</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #0b0d13;
      --panel: #151923;
      --panel-2: #1b2030;
      --line: #30384c;
      --ink: #f8f4e8;
      --muted: #a7aec0;
      --gold: #ffd458;
      --blue: #6db8ff;
      --danger: #ff766f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 45% -20%, #25335b, transparent 38%), var(--paper); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .top { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid #ffffff12; background: #0b0d13e8; backdrop-filter: blur(18px); }
    .top-inner, main { width: min(1540px, calc(100% - 32px)); margin: auto; }
    .top-inner { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 18px 0 14px; }
    .eyebrow { color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: clamp(24px, 3vw, 40px); line-height: 1; }
    .source { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    button, select, input { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    button { padding: 9px 13px; cursor: pointer; font-weight: 750; }
    button:hover { border-color: #5b6888; background: var(--panel-2); }
    .primary { border-color: #dcae2d; color: #221800; background: linear-gradient(#ffe58c, #ffc02e); }
    .primary:hover { border-color: #ffe58c; background: linear-gradient(#fff0b1, #ffd05a); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; padding: 12px 0 0; grid-column: 1 / -1; }
    .toolbar input[type="search"] { flex: 1 1 240px; min-width: 0; }
    .toolbar input, .toolbar select { min-height: 39px; padding: 8px 10px; color: var(--ink); }
    .toolbar label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
    .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    main { padding: 22px 0 70px; }
    .help { display: flex; justify-content: space-between; gap: 24px; align-items: start; margin-bottom: 18px; color: var(--muted); font-size: 14px; }
    .help strong { color: var(--ink); }
    .selection { min-width: 260px; text-align: right; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 13px; }
    .card { position: relative; overflow: hidden; min-width: 0; border: 2px solid transparent; border-radius: 13px; background: var(--panel); box-shadow: 0 8px 28px #0003; cursor: pointer; transition: transform .14s ease, border-color .14s ease; }
    .card:hover { transform: translateY(-2px); border-color: #59657e; }
    .card.selected { border-color: var(--gold); }
    .rank, .pick-order { position: absolute; z-index: 3; top: 8px; display: grid; place-items: center; min-width: 31px; height: 31px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 900; box-shadow: 0 3px 14px #0009; }
    .rank { left: 8px; color: #dbe3f7; background: #101522db; }
    .pick-order { right: 8px; color: #251900; background: var(--gold); opacity: 0; transform: scale(.75); transition: .14s ease; }
    .selected .pick-order { opacity: 1; transform: scale(1); }
    .art { display: block; width: 100%; height: 245px; object-fit: cover; background: #232a3a; }
    .copy { padding: 11px 12px 13px; }
    .title, .artist { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .title { font-weight: 800; }
    .artist { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .meta { display: flex; gap: 7px; align-items: center; margin-top: 9px; color: #c6ccda; font-size: 11px; }
    .meta b { color: var(--gold); }
    .meta a { margin-left: auto; color: var(--blue); text-decoration: none; }
    .empty { grid-column: 1 / -1; padding: 70px 20px; color: var(--muted); text-align: center; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translate(-50%, 18px); padding: 11px 15px; border: 1px solid #ffffff24; border-radius: 10px; background: #151923ef; box-shadow: 0 12px 40px #0009; opacity: 0; pointer-events: none; transition: .2s ease; }
    .toast.on { transform: translate(-50%, 0); opacity: 1; }
    @media (max-width: 760px) {
      .top-inner { grid-template-columns: 1fr; }
      .actions { justify-content: stretch; }
      .actions button { flex: 1; }
      .help { display: block; }
      .selection { min-width: 0; margin-top: 7px; text-align: left; }
      .count { width: 100%; margin-left: 0; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .art { height: 190px; }
      .copy { padding: 9px; }
      .top-inner, main { width: min(100% - 20px, 1540px); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <div class="eyebrow">Pocket Gacha · art picker</div>
        <h1 id="heading">Choose artwork</h1>
        <div class="source" id="source"></div>
      </div>
      <div class="actions">
        <button id="clear" type="button">Clear</button>
        <button id="copy" type="button">Copy JSON</button>
        <button class="primary" id="export" type="button">Save picks.json</button>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Filter title, artist, or tag…" aria-label="Filter results">
        <label>Orientation
          <select id="orientation">
            <option value="all">All</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option><option value="square">Square-ish</option>
          </select>
        </label>
        <label>Minimum saves <input id="bookmarks" type="number" min="0" value="0" step="100"></label>
        <label>Art route
          <select id="route">
            <option value="cohesive">Cohesive scene</option>
            <option value="composite">Background + cut-out</option>
            <option value="animated">SSR animated art</option>
          </select>
        </label>
        <span class="count" id="count"></span>
      </div>
    </div>
  </header>

  <main>
    <div class="help">
      <div><strong>Click favorites in preference order.</strong> Pick #1 is the primary art; later picks are backups. Click again to remove one. Use this page whenever the owner wants the final visual choice.</div>
      <div class="selection" id="selection">Nothing selected yet.</div>
    </div>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const payload = __PIXIV_PICKER_DATA__;
    const storageKey = `pocket-gacha:picks:${payload.unitId}`;
    const byId = new Map(payload.results.map((row) => [String(row.id), row]));
    let selected = JSON.parse(localStorage.getItem(storageKey) || '[]').filter((id) => byId.has(String(id))).map(String);

    const $ = (id) => document.getElementById(id);
    $('heading').textContent = `Choose artwork · ${payload.unitId}`;
    $('source').textContent = `${payload.label} · ${payload.results.length} works ranked by Pixiv bookmarks`;

    function orientation(row) {
      const ratio = row.w / row.h;
      return ratio > 1.16 ? 'landscape' : ratio < .86 ? 'portrait' : 'square';
    }
    function matches(row) {
      const query = $('search').value.trim().toLocaleLowerCase();
      const words = [row.title, row.user, ...(row.tags || [])].join(' ').toLocaleLowerCase();
      return (!query || words.includes(query))
        && ($('orientation').value === 'all' || orientation(row) === $('orientation').value)
        && row.bm >= Number($('bookmarks').value || 0);
    }
    function card(row, rank) {
      const root = document.createElement('article');
      root.className = 'card';
      root.tabIndex = 0;
      root.setAttribute('role', 'button');
      root.setAttribute('aria-label', `Select ${row.title} by ${row.user}`);
      const rankBadge = document.createElement('span'); rankBadge.className = 'rank'; rankBadge.textContent = `#${rank}`;
      const pickBadge = document.createElement('span'); pickBadge.className = 'pick-order';
      const image = document.createElement('img'); image.className = 'art'; image.src = row.thumb; image.alt = ''; image.loading = 'lazy';
      const copy = document.createElement('div'); copy.className = 'copy';
      const title = document.createElement('div'); title.className = 'title'; title.textContent = row.title;
      const artist = document.createElement('div'); artist.className = 'artist'; artist.textContent = row.user;
      const meta = document.createElement('div'); meta.className = 'meta';
      const saves = document.createElement('b'); saves.textContent = `${row.bm.toLocaleString()} saves`;
      const size = document.createElement('span'); size.textContent = `${row.w}×${row.h}`;
      const link = document.createElement('a'); link.href = row.url; link.target = '_blank'; link.rel = 'noreferrer'; link.textContent = 'Pixiv ↗';
      link.addEventListener('click', (event) => event.stopPropagation());
      meta.append(saves, size, link); copy.append(title, artist, meta); root.append(rankBadge, pickBadge, image, copy);
      const toggle = () => { const id = String(row.id), at = selected.indexOf(id); at >= 0 ? selected.splice(at, 1) : selected.push(id); persist(); render(); };
      root.addEventListener('click', toggle);
      root.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); } });
      const picked = selected.indexOf(String(row.id));
      root.classList.toggle('selected', picked >= 0); root.setAttribute('aria-pressed', String(picked >= 0)); pickBadge.textContent = picked >= 0 ? picked + 1 : '';
      return root;
    }
    function persist() { localStorage.setItem(storageKey, JSON.stringify(selected)); }
    function render() {
      const rows = payload.results.filter(matches);
      $('grid').replaceChildren(...(rows.length ? rows.map((row) => card(row, payload.results.indexOf(row) + 1)) : [Object.assign(document.createElement('div'), { className: 'empty', textContent: 'No artwork matches these filters.' })]));
      $('count').textContent = `${rows.length} shown · ${selected.length} picked`;
      $('selection').textContent = selected.length ? `Primary: ${byId.get(selected[0]).title} · ${selected.length} picked` : 'Nothing selected yet.';
    }
    function output() {
      return {
        schema: 1,
        units: {
          [payload.unitId]: {
            artRoute: $('route').value,
            picks: selected.map((id, index) => {
              const row = byId.get(id);
              return { role: index ? 'alternate' : 'primary', provider: 'pixiv', artworkId: String(row.id), pageUrl: row.url, artist: row.user, title: row.title, bookmarks: row.bm, width: row.w, height: row.h, originalUrl: row.urls.original };
            }),
          },
        },
      };
    }
    function notify(message) { $('toast').textContent = message; $('toast').classList.add('on'); clearTimeout(notify.timer); notify.timer = setTimeout(() => $('toast').classList.remove('on'), 1800); }
    function requirePick() { if (selected.length) return true; notify('Pick at least one artwork first.'); return false; }
    $('export').addEventListener('click', () => {
      if (!requirePick()) return;
      const blob = new Blob([JSON.stringify(output(), null, 2) + '\n'], { type: 'application/json' });
      const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'picks.json'; link.click(); URL.revokeObjectURL(link.href); notify('Saved picks.json');
    });
    $('copy').addEventListener('click', async () => { if (!requirePick()) return; await navigator.clipboard.writeText(JSON.stringify(output(), null, 2) + '\n'); notify('Copied picks.json'); });
    $('clear').addEventListener('click', () => { selected = []; persist(); render(); });
    for (const id of ['search', 'orientation', 'bookmarks']) $(id).addEventListener('input', render);
    render();
  </script>
</body>
</html>
